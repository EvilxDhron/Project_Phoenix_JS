<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        background-color: #010101;
        color: aliceblue;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2rem;
      }

      h1 {
        font-size: 4rem;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 100;
      }
      textarea {
        background-color: grey;
        width: 300px;
        height: 150px;
        padding: 12px;
        font-size: 1.2rem;
        resize: none;
      }
      textarea:focus {
        outline: none;
        background-color: white;
      }
      button {
        width: 150px;
        height: 60px;
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        font-size: 1.5rem;
        border: none;
      }
      button::before{
        content: "Click Me";
      }
      button:active{
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <h1>&lt; Coding Challenge By JONAS(Udemy) &gt;</h1>

    <script type="module" src="script.js"></script>
  </body>
</html>
