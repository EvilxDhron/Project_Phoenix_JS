<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>BANKIST | When Banking meets Minimalist</title>
  </head>
  <body>
    <div class="overlay hidden"></div>
    <div class="modal hidden">
        <button id="closeModalBtn">x</button>
        <h2 id="modal-heading">Open your bank account <br/> in just <span class="highlighted">5 minutes</span></h2>
        <form id="modal-form">
            <label class="modal-label" for="name">First Name</label>
            <input class="modal-input" id="name" type="text"/>
            <label class="modal-label" for="lastName">Last Name</label>
            <input class="modal-input" id="lastName" type="text"/>
            <label class="modal-label" for="email">Email Address</label>
            <input class="modal-input" id="email" type="text"/>
            <button id="modal-btn" class="mainBtn" >Next step &RightArrow;</button>
        </form>
    </div>

    <header id="header">
      <nav id="nav">
        <img id="nav-img" src="./images/logo.png" />
        <ul id="nav-links">
          <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Operations</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Testimonials</a></li>
          <li class="nav-item"><a class="nav-link mainBtn nav-btn" href="#">Open Account</a></li>
        </ul>
      </nav>
    </header>

    <main id="main">
      <section class="section_1">
        <div class="sec1-part1">
          <h1 id="sec1-mainText">
            When <span class="highlighted">banking</span> meets
            <span class="highlighted">minimalist</span>
          </h1>
          <h4 id="sec1-text">A simpler banking experience for a simpler life.</h4>
          <button class="sec1-btn">Learn more &DownArrow;</button>
        </div>
        <div class="sec1-part2">
          <img id="sec1-img" src="./images/hero.png" />
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
