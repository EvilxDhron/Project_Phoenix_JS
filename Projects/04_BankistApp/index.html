<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bankist App</title>
     <link rel="icon" type="image/png" href="./Assets/arrows-circle.png">
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <!-- Project Bankist Application. -->

    <header>
        <nav>
            <div class="navSec1 greet">Good Morning, Dhron Yadav</div>

            <div class="navSec2">
                <img src="./Assets/circle.png"/>
            </div>
            
            <div class="navSec3">
                <input type="text" id="user" name="user" placeholder="user" maxlength="4"
                oninput="this.value = this.value.slice(0, 4);"/>

                <input type="number" id="pin" class="no-arrows" name="pin" placeholder="pin" maxlength="4"
                oninput="this.value = this.value.slice(0, 4);"/>

                <button id="navBtn"><img src="./Assets/right-arrow.png"/></button>
            </div>
        </nav>
    </header>
    <main>
        <section class="items-container">
            <div class="balancePart">
                <div class="sec1first">
                <h2>Current Balance</h2>
                <p>As of <span class="balanceDate">10/08/2026</span></p>
            </div>
            <div class="sec1second"><h1 class="totalBalance">2500000€<h1></div>
            </div>
            <div class="transactions">
                <div class="trans">
                    <div class="showStatus">
                        <div class="status status_Deposit"> 1 Deposit</div>
                        <div class="status_date">12/08/2026</div>
                    </div>
                    <div class="status_Amount">26000,00€</div>
                </div>
                <div class="line"></div>
                <div class="trans">
                    <div class="showStatus">
                        <div class="status status_Withdraw">2 Withdraw</div>
                        <div class="status_date">12/08/2026</div>
                    </div>
                    <div class="status_Amount">-1300€</div>
                </div>
                <div class="line"></div>
            </div>
            <div class="transfer">
                <h2>Transfer Money</h2>
                <div class="transInputs">
                    <input type="text" id="transUser" name="transUser" maxlength="4"
                    oninput="this.value = this.value.slice(0, 4);"/>
                    <label for="transUser">Transfer To</label>
                    <input type="number" id="transAmt" name="transAmt" class="no-arrows"/>
                    <label for="transAmt">Amount</label>
                    <button id="transBtn"><img src="./Assets/right-arrow.png"/></button>
                </div>
            </div>
            <div class="loan">
                <h2>Request Loan</h2>
                <div class="loanInputs">
                    <input type="number" id="loanAmt" name="loanAmt" class="no-arrows"/>
                    <label for="loanAmt">Amount</label>
                    <button id="loanBtn"><img src="./Assets/right-arrow.png"/></button>
                </div>
            </div>
            <div class="close">
                <h2>Close Account</h2>
                <div class="closeInputs">
                    <input type="text" id="closeUser" name="closeUser" maxlength="4"
                    oninput="this.value = this.value.slice(0, 4);"/>
                    <label for="closeUser">Confirm User</label>
                    <input type="number" id="closePin" name="closePin" class="no-arrows" oninput="this.value = this.value.slice(0, 4);"/>
                    <label for="closePin">Confirm Pin</label>
                    <button id="closeBtn"><img src="./Assets/right-arrow.png"/></button>
                </div>
            </div>
            <div class="summary">
                <div class="amtstatus">IN&nbsp; <span class="sumAmtDeposit">27000,00€</span></div>
                <div class="amtstatus">OUT &nbsp;<span class="sumAmtWithdraw">27000,00€</span></div>
                <div class="amtstatus">INTEREST &nbsp;<span class="sumAmtInterest">27000,00€</span></div>
                <button id="sortBtn"><img src="./Assets/down-arrow.png" alt="#"/>sort</button>
            </div>
            <div class="logoutTime"><h5>You will be logged out in <span class="logoutTimer">12:00</span></h5></div>
        </section>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
